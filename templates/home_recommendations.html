<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home Budget Plan | PocketSmart AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        nav {
            background: #111827;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 22px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .detail-box {
            background: #f8fafc;
            padding: 18px;
            border-radius: 10px;
        }

        .detail-box span {
            display: block;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .detail-box strong {
            font-size: 18px;
        }

        .recommendation {
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 15px;
            background: #f8fafc;
            padding: 25px;
            border-radius: 12px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 18px;
            border-radius: 10px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .button {
            display: inline-block;
            padding: 13px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        @media (max-width: 600px) {

            nav {
                padding: 15px 5%;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .card {
                padding: 20px;
            }

            .header h1 {
                font-size: 27px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<nav>

    <h2>🏠 PocketSmart AI</h2>

    <div>
        <a href="/dashboard">Dashboard</a>

        <a href="#" onclick="logout()">
            Logout
        </a>
    </div>

</nav>


<div class="container">

    <div class="header">

        <h1>🏠 Your Home Budget Plan</h1>

        <p>
            AI-generated budget planning based on your requirements.
        </p>

    </div>


    <div id="loading" class="card loading">

        ⏳ Loading your budget plan...

    </div>


    <div id="content" style="display:none;">

        <div class="card">

            <div class="details">

                <div class="detail-box">

                    <span>Planning Category</span>

                    <strong id="category">
                        Home Budget
                    </strong>

                </div>


                <div class="detail-box">

                    <span>Total Budget</span>

                    <strong id="budget">
                        -
                    </strong>

                </div>

            </div>


            <h2 style="margin-bottom:15px;">
                🤖 AI Budget Breakdown
            </h2>


            <div
                id="recommendation"
                class="recommendation"
            ></div>


            <div class="buttons">

                <a
                    href="/home-planner"
                    class="button primary"
                >
                    + Create New Plan
                </a>


                <a
                    href="/dashboard"
                    class="button secondary"
                >
                    ← Dashboard
                </a>

            </div>

        </div>

    </div>


    <div
        id="error"
        class="card"
        style="display:none;"
    ></div>

</div>


<script>

    const token =
        localStorage.getItem("access_token");


    function logout() {

        localStorage.removeItem(
            "access_token"
        );

        localStorage.removeItem(
            "username"
        );

        localStorage.removeItem(
            "latest_recommendation_id"
        );

        window.location.href =
            "/login";
    }


    async function loadRecommendation() {

        if (!token) {

            window.location.href =
                "/login";

            return;
        }


        try {

            const response = await fetch(
                "/recommendations/latest-home",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


            const data =
                await response.json();


            if (response.status === 401) {

                localStorage.removeItem(
                    "access_token"
                );

                localStorage.removeItem(
                    "username"
                );

                window.location.href =
                    "/login";

                return;
            }


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Unable to load budget plan."
                );

            }


            if (
                data.recommendation ===
                "AI_LIMIT_REACHED"
            ) {

                throw new Error(
                    "Gemini AI daily limit has been reached. Please try again later."
                );

            }


            document.getElementById(
                "category"
            ).textContent =
                data.category;


            document.getElementById(
                "budget"
            ).textContent =
                data.budget;


            document.getElementById(
                "recommendation"
            ).textContent =
                data.recommendation;


            document.getElementById(
                "loading"
            ).style.display =
                "none";


            document.getElementById(
                "content"
            ).style.display =
                "block";


        } catch (error) {

            console.error(error);


            document.getElementById(
                "loading"
            ).style.display =
                "none";


            const errorBox =
                document.getElementById(
                    "error"
                );


            errorBox.style.display =
                "block";


            errorBox.innerHTML = `
                <strong>⚠️ Unable to load your budget plan</strong>
                <br><br>
                ${error.message}
                <br><br>
                <a href="/home-planner">
                    Go back to Home Budget Planner
                </a>
            `;

        }

    }


    loadRecommendation();

</script>

</body>

</html>
